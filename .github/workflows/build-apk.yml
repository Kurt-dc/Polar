name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Явно ставим Android SDK нужной версии и принимаем лицензии —
      # самая частая причина "exit code 1" на голом ubuntu-latest:
      # без этого Gradle падает с "You have not accepted the license
      # agreements" или "SDK location not found", но текст этой ошибки
      # тонет в общем логе и в сводке аннотаций не виден.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: polar-holter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Если сборка всё же упадёт — лог со стектрейсом сохранится как
      # артефакт, даже без доступа к полному выводу консоли.
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            **/build/reports/**
            app/build/outputs/**
